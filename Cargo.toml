# SPDX-License-Identifier: GPL-2.0-only
[package]
name = "vc4d"
description = "VideoCore IV display driver for Redox: HVS planes (Raspberry Pi 3, Zero 2 W)"
version = "0.1.0"
edition = "2024"
license = "GPL-2.0-only"

# The Redox driver crates come from upstream base at the commit redox-rpi
# pins in config/upstream.lock; redox-rpi does not patch them.
[dependencies]
common = { git = "https://gitlab.redox-os.org/redox-os/base.git", rev = "eddcaa21fb2d11b4a6bd64478e0639153266dc04" }
daemon = { git = "https://gitlab.redox-os.org/redox-os/base.git", rev = "eddcaa21fb2d11b4a6bd64478e0639153266dc04" }
driver-graphics = { git = "https://gitlab.redox-os.org/redox-os/base.git", rev = "eddcaa21fb2d11b4a6bd64478e0639153266dc04" }
drm-sys = "0.8.1"
fdt = { git = "https://github.com/repnop/fdt.git", rev = "059bb23" }
libredox = "0.1.25"
redox_event = "0.4.8"
redox_syscall = { version = "0.9.5", features = ["std"] }
